<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZENŌBA — Admin Login</title>

<style>
:root {
  --bg:#f5f1eb;
  --card:#ffffff;
  --text:#211c19;
  --muted:#81776f;
  --accent:#c86b45;
  --border:#e7ded5;
}

body.dark {
  --bg:#111315;
  --card:#202326;
  --text:#f5f2ed;
  --muted:#aaa39b;
  --accent:#e28a61;
  --border:#393d40;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

.login-box {
  width:100%;
  max-width:420px;
  padding:35px;
  border:1px solid var(--border);
  border-radius:24px;
  background:var(--card);
  box-shadow:0 15px 50px rgba(0,0,0,.12);
}

.logo {
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:12px;
}

.logo span {
  color:var(--accent);
}

.tagline {
  text-align:center;
  color:var(--muted);
  margin-bottom:35px;
}

h2 {
  font-size:25px;
  margin-bottom:9px;
}

.subtitle {
  color:var(--muted);
  margin-bottom:25px;
  font-size:14px;
}

label {
  display:block;
  margin:17px 0 8px;
  font-size:14px;
  font-weight:bold;
}

input {
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  outline:none;
}

input:focus {
  border-color:var(--accent);
}

.password-box {
  position:relative;
}

.password-box button {
  position:absolute;
  right:12px;
  top:12px;
  border:0;
  background:none;
  color:var(--muted);
  cursor:pointer;
  font-size:18px;
}

.forgot {
  display:block;
  text-align:right;
  margin-top:13px;
  color:var(--accent);
  font-size:14px;
  text-decoration:none;
}

.login-btn {
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:hover {
  opacity:.9;
}

.theme {
  display:block;
  margin:22px auto 0;
  padding:10px 17px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  cursor:pointer;
}

.footer {
  text-align:center;
  margin-top:28px;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:480px) {
  .login-box {
    padding:27px 22px;
  }
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">ZENŌ<span>BA</span></div>
  <p class="tagline">Clothing & Everyday Style</p>

  <h2>Admin Login</h2>
  <p class="subtitle">Sign in to manage your store.</p>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>

    <div class="password-box">
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >
      <button type="button" onclick="togglePassword()">
        👁️
      </button>
    </div>

    <a href="#" class="forgot" onclick="forgotPassword(event)">
      Forgot Password?
    </a>

    <button class="login-btn" type="submit">
      Sign In →
    </button>

  </form>

  <button class="theme" onclick="toggleTheme()">
    🌙 / ☀️ Change Theme
  </button>

  <div class="footer">
    © 2026 ZENŌBA. All rights reserved.
  </div>

</div>

<script>
function togglePassword() {
  const field = document.getElementById("password");

  field.type =
    field.type === "password" ? "text" : "password";
}

function toggleTheme() {
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "zenoba-theme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );
}

if(localStorage.getItem("zenoba-theme") === "dark") {
  document.body.classList.add("dark");
}

function forgotPassword(event) {
  event.preventDefault();
  alert("Password recovery will be connected with Supabase.");
}

document.getElementById("loginForm").addEventListener(
  "submit",
  function(event) {
    event.preventDefault();

    alert("Login authentication is not connected yet. Please wait for Supabase integration.");
  }
);
</script>

</body>
  </html>
